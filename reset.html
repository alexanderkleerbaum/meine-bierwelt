<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meine Bierwelt – Passwort zurücksetzen</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🍺 Meine Bierwelt – Passwort zurücksetzen</h1><div class="panel" style="max-width:580px"><p id="status" role="status">Bereit.</p><section id="request"><p>Gib die E-Mail-Adresse deines Supabase-Benutzerkontos ein.</p><div class="controls"><input id="email" type="email" placeholder="E-Mail-Adresse" autocomplete="email"><button id="send">Reset-Link senden</button></div></section><section id="change" class="hidden"><p>Lege dein neues Passwort fest.</p><div class="controls"><input id="password" type="password" placeholder="Neues Passwort (mind. 8 Zeichen)" autocomplete="new-password"><button id="update">Passwort ändern</button></div></section></div><p><a href="admin.html">Zur Anmeldung</a></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="reset.js"></script></body></html>
